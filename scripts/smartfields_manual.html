<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFields dLocal Go — pasos 2 y 3</title>
<style>
  body{font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:#14141c;color:#eee;margin:0;padding:32px;display:flex;
       justify-content:center}
  .w{width:100%;max-width:520px}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{color:#9a9aa8;margin:0 0 24px;font-size:13px}
  label{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
        color:#a78bfa;margin:18px 0 6px}
  input,#card{background:#1e1e2a;border:1px solid #33334a;border-radius:8px;
              padding:12px;width:100%;box-sizing:border-box;color:#fff;font-size:15px}
  #card{min-height:48px}
  button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:8px;
         background:#8b5cf6;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  pre{background:#0e0e16;border:1px solid #33334a;border-radius:8px;padding:12px;
      margin-top:18px;white-space:pre-wrap;word-break:break-all;font-size:12.5px}
  .ok{color:#4ade80} .err{color:#f87171}
</style>
</head>
<body>
<div class="w">
  <h1>SmartFields — pasos 2 y 3</h1>
  <p class="sub">
    Paso 2: <code>initialize()</code>. Paso 3: <code>createCardToken()</code>.<br>
    El número de tarjeta vive en un iframe de dLocal; esta página no lo ve.
  </p>

  <label for="tok">merchant_checkout_token (del paso 1)</label>
  <input id="tok" placeholder="DP-…">

  <label for="key">SmartFields API key</label>
  <input id="key" placeholder="f6e50ad1-…">

  <label>Titular de la tarjeta</label>
  <input id="name" placeholder="Damian Perez" value="Damian Perez">

  <label>Tarjeta</label>
  <div id="card"></div>

  <button id="go" disabled>Cargando SDK…</button>
  <pre id="out">Rellena el token y la key, y pulsa.</pre>
</div>

<!-- PASO 2 (parte a): el SDK. Producción. El de pruebas es checkout-sbx… -->
<script src="https://checkout.dlocalgo.com/js/dlocalgo-smartfields-bundled.js"></script>
<script>
const $ = id => document.getElementById(id);
const out = (t, cls) => { $('out').className = cls || ''; $('out').textContent = t; };

// token y key se pueden pasar por la URL: ?token=DP-123&key=f6e5…
const qs = new URLSearchParams(location.search);
if (qs.get('token')) $('tok').value = qs.get('token');
if (qs.get('key'))   $('key').value = qs.get('key');

let field = null;

window.addEventListener('load', () => {
  if (!window.dlocalGo) { out('No cargó el SDK de dLocal.', 'err'); return; }
  $('go').disabled = false;
  $('go').textContent = 'Montar formulario';
  $('go').onclick = field ? tokenizar : montar;
});

// PASO 2 (parte b) — initialize + fields().create('card').mount()
async function montar() {
  const token = $('tok').value.trim(), key = $('key').value.trim();
  if (!token || !key) { out('Faltan el token o la key.', 'err'); return; }
  try {
    out('initialize(key, token)…');
    await window.dlocalGo.initialize(key, token);

    const card = window.dlocalGo.fields().create('card', {
      style: { base: { fontSize: '16px', color: '#ffffff',
                       '::placeholder': { color: '#8a8a8a' } } }
    });
    card.mount($('card'));
    field = card;

    $('go').textContent = 'Generar cardToken';
    $('go').onclick = tokenizar;
    out('Formulario montado. Escribe la tarjeta y pulsa.', 'ok');
  } catch (e) {
    out('initialize falló:\n' + (e && e.message ? e.message : JSON.stringify(e)), 'err');
  }
}

// PASO 3 — createCardToken(field, {name})
async function tokenizar() {
  try {
    out('createCardToken(field, {name})…');
    const r = await window.dlocalGo.createCardToken(field, { name: $('name').value.trim() });
    // La doc: const { token: cardToken } = response
    if (r && r.token) {
      out('cardToken:\n\n' + r.token +
          '\n\nAhora, en la terminal:\n' +
          'bash scripts/smartfields_manual.sh ' + $('tok').value.trim() + ' ' + r.token, 'ok');
    } else {
      // Nunca el contenido: ahí puede haber datos de la tarjeta. Solo las claves.
      out('Sin `token`. Campos devueltos: ' +
          (r && typeof r === 'object' ? Object.keys(r).join(', ') : typeof r), 'err');
    }
  } catch (e) {
    out('createCardToken falló:\n' + (e && e.message ? e.message : JSON.stringify(e)), 'err');
  }
}
</script>
</body>
</html>
